add_newline = true

format = '''
[╭─](dimmed white)$os$hostname$directory$git_branch$git_status$git_state
[╰─](dimmed white)$cmd_duration$character'''

[os]
disabled = false
style = 'bold purple'
format = '[$symbol]($style)'

[os.symbols]
Ubuntu = '󰕈 '
Unknown = '󰀻 '

[hostname]
ssh_only = false
ssh_symbol = '󰌾 '
format = '[$ssh_symbol$hostname]($style) '
style = 'bold purple'

[directory]
style = 'bold purple'
format = '[>]($style) [$path]($style)'
truncation_length = 4
truncate_to_repo = true
read_only = ' 󰌾'
read_only_style = 'bold red'

[git_branch]
symbol = ' 󰊢 '
style = 'bold blue'
format = '[$symbol$branch]($style)'

[git_status]
style = 'yellow'
format = ' ([\[$all_status$ahead_behind\]]($style))'

[git_state]
style = 'bold purple'
format = ' [$state( $progress_current/$progress_total)]($style)'

[cmd_duration]
min_time = 2000
style = 'dimmed yellow'
format = '[󱎫 $duration]($style) '

[character]
success_symbol = '[](bold green)'
error_symbol = '[✘](bold red)'
vimcmd_symbol = '[](bold blue)'
