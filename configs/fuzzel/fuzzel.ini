include=~/.config/fuzzel/themes/tokyo-night-storm.ini

# Typography
font=Iosevka NF:size=15
use-bold=yes
dpi-aware=auto

# Search and desktop entries
prompt="  "
placeholder=Search applications...
icons-enabled=false
fields=name,generic,exec,keywords,categories,comment
match-mode=fzf
sort-result=yes
match-counter=yes
show-actions=no
filter-desktop=no

# Window geometry
anchor=center
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes
width=55
lines=9
horizontal-pad=22
vertical-pad=14
inner-pad=8
line-height=32
image-size-ratio=0

# Input and launch behavior
enable-mouse=yes
