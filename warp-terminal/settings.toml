[appearance]
spacing = "compact"

[appearance.themes]
system_theme = false
theme = "dark"
selected_system_themes = { dark = "dracula", light = "light" }

[appearance.panes]
should_dim_inactive_panes = false

[appearance.cursor]
cursor_display_type = "bar"

[appearance.window]
open_windows_at_custom_size = true
new_windows_num_columns = 120
new_windows_num_rows = 68
override_opacity = 77

[appearance.full_screen_apps]
alt_screen_padding = { custom = { uniform_padding = 0.0 } }

[appearance.vertical_tabs]
enabled = true

[appearance.input]
input_mode = "waterfall"

[appearance.text]
font_name = "JetBrainsMono Nerd Font"
font_size = 17.0
ai_font_name = "JetBrainsMono Nerd Font"
match_ai_font = false
ligature_rendering_enabled = true
notebook_font_size = 16.0
match_notebook_to_monospace_font_size = false

[agents]
